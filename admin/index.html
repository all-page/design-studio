<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>상담 신청함</title>
<style>
  :root { --bg: #0e0d0c; --card: #161412; --line: #2a2622; --text: #ece6dc; --muted: #9c948a; --gold: #c8a46a; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 "Noto Sans KR", system-ui, sans-serif; word-break: keep-all; }
  .wrap { width: min(720px, 100% - 32px); margin: 0 auto; padding: 32px 0 64px; }
  h1 { font-size: 20px; font-weight: 500; margin: 0 0 24px; }
  input[type=password] { width: 100%; font-size: 18px; padding: 14px; background: var(--card); color: var(--text); border: 1px solid var(--line); }
  input[type=password]:focus { outline: none; border-color: var(--gold); }
  button { font: inherit; cursor: pointer; min-height: 48px; }
  .primary { width: 100%; margin-top: 12px; background: var(--gold); color: #17130d; border: 0; font-weight: 500; }
  .err { color: #e08a7a; min-height: 1.5em; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 24px; }
  .count { font-size: 15px; color: var(--muted); }
  .count b { display: block; font-size: 44px; line-height: 1.1; color: var(--gold); font-weight: 500; }
  .ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 0 16px; }
  .card { background: var(--card); border: 1px solid var(--line); padding: 18px; margin-bottom: 12px; }
  .card.new { border-left: 3px solid var(--gold); }
  .meta { font-size: 14px; color: var(--muted); }
  .name { font-size: 18px; font-weight: 500; margin: 4px 0; }
  .contact { background: none; border: 0; color: var(--gold); padding: 0; min-height: 40px; text-decoration: underline; text-underline-offset: 3px; font-size: 17px; }
  .design { margin: 4px 0 14px; }
  .status { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
  .status button { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .status button.on { background: var(--gold); color: #17130d; border-color: var(--gold); }
  .empty { color: var(--muted); text-align: center; padding: 40px 0; }
</style>
</head>
<body>
<div class="wrap">
  <section id="login">
    <h1>상담 신청함</h1>
    <form id="login-form">
      <input type="password" id="pw" placeholder="관리자 비밀번호" autocomplete="current-password" required>
      <button class="primary" type="submit">들어가기</button>
      <p class="err" id="login-err" role="alert"></p>
    </form>
  </section>

  <section id="board" hidden>
    <div class="top">
      <div class="count">새 문의<b id="new-count">0</b></div>
      <div>
        <button class="ghost" id="reload">새로고침</button>
        <button class="ghost" id="logout">나가기</button>
      </div>
    </div>
    <p class="err" id="board-err" role="alert"></p>
    <div id="list"></div>
  </section>
</div>

<script>
  const STATUSES = ['새 문의', '연락함', '완료'];
  const $ = (id) => document.getElementById(id);
  const getPw = () => sessionStorage.getItem('adminPw') || '';

  async function api(method, body) {
    const r = await fetch('/api/admin', {
      method,
      headers: { 'x-admin-password': getPw(), ...(body ? { 'Content-Type': 'application/json' } : {}) },
      body: body ? JSON.stringify(body) : undefined,
    });
    const data = await r.json().catch(() => ({}));
    if (r.status === 401) { logout('비밀번호가 맞지 않아요.'); throw new Error(''); }
    if (!r.ok) throw new Error(data.error || '잠시 뒤 다시 시도해 주세요.');
    return data;
  }

  function logout(message = '') {
    sessionStorage.removeItem('adminPw');
    $('board').hidden = true; $('login').hidden = false;
    $('pw').value = ''; $('login-err').textContent = message; $('pw').focus();
  }

  function fmt(d) {
    const t = new Date(d);
    return `${t.getMonth() + 1}월 ${t.getDate()}일 ${String(t.getHours()).padStart(2, '0')}:${String(t.getMinutes()).padStart(2, '0')}`;
  }

  function render(rows) {
    $('new-count').textContent = rows.filter((r) => r.status === '새 문의').length;
    const list = $('list');
    list.textContent = '';
    if (!rows.length) { list.innerHTML = '<p class="empty">아직 들어온 상담 신청이 없어요.</p>'; return; }
    for (const r of rows) {
      const card = document.createElement('article');
      card.className = 'card' + (r.status === '새 문의' ? ' new' : '');
      const meta = document.createElement('div'); meta.className = 'meta'; meta.textContent = fmt(r.created_at);
      const name = document.createElement('div'); name.className = 'name'; name.textContent = r.name;
      const contact = document.createElement('button'); contact.className = 'contact'; contact.textContent = r.contact;
      contact.title = '눌러서 복사';
      contact.onclick = async () => {
        try { await navigator.clipboard.writeText(r.contact); contact.textContent = '복사했어요 ✓'; setTimeout(() => { contact.textContent = r.contact; }, 1200); }
        catch { const s = getSelection(); const rg = document.createRange(); rg.selectNodeContents(contact); s.removeAllRanges(); s.addRange(rg); }
      };
      const design = document.createElement('div'); design.className = 'design';
      design.textContent = '필요한 디자인: ' + (r.design_type || '선택 안 함');
      const st = document.createElement('div'); st.className = 'status';
      for (const s of STATUSES) {
        const b = document.createElement('button'); b.textContent = s;
        if (r.status === s) b.className = 'on';
        b.onclick = async () => {
          try { await api('PATCH', { id: r.id, status: s }); load(); }
          catch (e) { if (e.message) $('board-err').textContent = e.message; }
        };
        st.appendChild(b);
      }
      card.append(meta, name, contact, design, st);
      list.appendChild(card);
    }
  }

  async function load() {
    $('board-err').textContent = '';
    try {
      const { rows } = await api('GET');
      $('login').hidden = true; $('board').hidden = false;
      render(rows);
    } catch (e) { if (e.message) { $('board-err').textContent = e.message; $('login-err').textContent = e.message; } }
  }

  $('login-form').addEventListener('submit', (e) => {
    e.preventDefault();
    sessionStorage.setItem('adminPw', $('pw').value);
    $('login-err').textContent = '';
    load();
  });
  $('reload').onclick = load;
  $('logout').onclick = () => logout();
  if (getPw()) load(); else $('pw').focus();
</script>
</body>
</html>
